<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Panel</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">Flow Panel <span id="version"></span></div>
    <div class="summary">
      <span id="connection" class="connection">连接中…</span>
      <span id="counts" class="muted"></span>
      <span class="total">总网速 <strong id="total-speed">0 B/s</strong></span>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索名称或链接" aria-label="搜索任务">
      <div class="actions">
        <button id="import" type="button">导入</button>
        <button id="export" type="button">导出</button>
        <span class="divider"></span>
        <button id="start-all" type="button">全部开始</button>
        <button id="stop-all" type="button">全部停止</button>
        <button id="add-task" type="button" class="primary">添加任务</button>
      </div>
    </div>

    <table>
      <thead>
        <tr><th>任务</th><th>状态</th><th>并发</th><th>次数</th><th class="num">网速</th><th class="ops">操作</th></tr>
      </thead>
      <tbody id="task-body"></tbody>
    </table>
    <p id="empty" class="empty" hidden>还没有任务。点击“添加任务”，或导入配置文件。</p>
    <p id="no-results" class="empty" hidden>没有匹配的任务。</p>
  </main>

  <dialog id="task-dialog" aria-labelledby="form-title">
    <form id="task-form" method="dialog">
      <h2 id="form-title">添加任务</h2>
      <fieldset id="form-fields">
        <label for="task-urls">下载链接 <small id="url-note">每行一个，每条链接是一个独立任务</small></label>
        <textarea id="task-urls" rows="4" required spellcheck="false" placeholder="https://example.com/file.bin"></textarea>

        <label for="task-name">名称 <small>可留空，默认使用文件名</small></label>
        <input id="task-name" maxlength="80">

        <div class="grid">
          <div><label for="task-concurrency">并发数</label><input id="task-concurrency" type="number" min="1" max="64" value="8" required></div>
          <div><label for="task-repeat">下载次数</label><input id="task-repeat" type="number" min="1" max="1000000" value="1" required></div>
        </div>
        <label class="check"><input id="task-infinite" type="checkbox" checked> 无限循环，直到手动停止</label>

        <details id="ip-section">
          <summary>指定服务器 IP</summary>
          <textarea id="task-ip" rows="3" spellcheck="false" placeholder="192.168.1.10&#10;2001:db8::10"></textarea>
          <p class="hint">每行一个 IP，按顺序轮流使用。保留原域名的 Host 和 HTTPS 证书校验；留空则正常解析域名。</p>
        </details>

        <details id="advanced-section">
          <summary>更多设置</summary>
          <div class="grid">
            <div><label for="task-rate">限速 MiB/s</label><input id="task-rate" type="number" min="0" max="100000" step="any" value="0"></div>
            <div><label for="task-timeout">超时（秒）</label><input id="task-timeout" type="number" min="1" max="120" step="any" value="15"></div>
            <div><label for="task-interval">重复间隔（秒）</label><input id="task-interval" type="number" min="0" max="3600" step="any" value="0.2"></div>
            <div><label for="task-max">流量上限 GiB</label><input id="task-max" type="number" min="0" max="1000000" step="any" value="0"></div>
            <div><label for="task-duration">运行时长（分钟）</label><input id="task-duration" type="number" min="0" max="525600" step="any" value="0"></div>
          </div>
          <p class="hint">填 0 表示不限制。</p>
        </details>
      </fieldset>
      <p id="form-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="cancel">取消</button>
        <button type="submit" id="save-task" class="primary">添加</button>
      </div>
    </form>
  </dialog>

  <dialog id="import-dialog" aria-labelledby="import-title">
    <form id="import-form" method="dialog">
      <h2 id="import-title">导入配置</h2>
      <fieldset id="import-fields">
        <label for="import-file">配置文件（.json）</label>
        <input id="import-file" type="file" accept=".json,application/json" required>
        <label class="check"><input type="radio" name="import-mode" value="append" checked> 追加到现有任务</label>
        <label class="check"><input type="radio" name="import-mode" value="replace"> 替换全部任务（需先全部停止）</label>
        <p class="hint">导入的任务处于停止状态，可点击“全部开始”启动。</p>
      </fieldset>
      <p id="import-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="cancel">取消</button>
        <button type="submit" id="import-submit" class="primary">导入</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
