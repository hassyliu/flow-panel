<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Flow Panel</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <form id="login" class="login-card">
    <div class="brand"><img src="/favicon.svg" alt="" width="30" height="30"><span>Flow Panel</span></div>
    <label for="password">访问密码</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus>
    <p id="error" class="error" role="alert"></p>
    <button id="submit" type="submit" class="primary">登录</button>
  </form>
  <script>
    "use strict";
    const form = document.getElementById("login");
    const error = document.getElementById("error");
    const submit = document.getElementById("submit");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submit.disabled = true;
      error.textContent = "";
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("password").value }),
        });
        if (response.ok) {
          window.location.reload();
          return;
        }
        const data = await response.json().catch(() => ({}));
        error.textContent = data.error || `登录失败（${response.status}）`;
        document.getElementById("password").select();
      } catch (_) {
        error.textContent = "无法连接到面板";
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
