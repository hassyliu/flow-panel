name: Docker

# Push a tag like v2.0.0 to publish <user>/flow-panel:2.0.0, :2.0 and :latest.
# "Run workflow" on the Actions page publishes :latest from the chosen branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/flow-panel
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Sync DOCKERHUB.md to the Docker Hub overview. Needs a token with the
      # Read, Write, Delete scope; a failure here never blocks the release.
      - name: Fill in the image name
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: sed -i "s#用户名/flow-panel#${HUB_USER}/flow-panel#g" DOCKERHUB.md
      - uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/flow-panel
          short-description: 低配机器友好的局域网下载任务面板：并发、限速、定时、指定 IP，约 3 MB
          readme-filepath: ./DOCKERHUB.md
