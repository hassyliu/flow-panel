[package]
name = "flow-panel"
version = "2.0.0"
edition = "2024"
description = "LAN download traffic panel with independent tasks"
publish = false

[dependencies]
bytes = "1.12.2"
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
percent-encoding = "2.3.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
url = "2.5.9"
webpki-roots = "1.0.12"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
